-- รันใน Supabase SQL Editor ได้เลย

-- 1. ตาราง Orders = Row หลัก
create table public.orders (
  id uuid primary key default gen_random_uuid(),
  order_no text unique not null, -- ORD-1042
  customer text not null,
  items text not null,
  total integer not null,
  status text not null default 'pending' check (status in ('pending','packing','shipping','done')),
  user_id uuid references auth.users(id),
  workspace_id uuid,
  created_at timestamptz default now()
);

-- 2. ChatRoom ผูกกับ Order 1-1
create table public.chat_rooms (
  id uuid primary key default gen_random_uuid(),
  row_id uuid unique references public.orders(id) on delete cascade, -- สำคัญ: 1 ออเดอร์ = 1 ห้อง
  created_at timestamptz default now()
);

-- 3. Messages ในห้องนั้น
create table public.messages (
  id uuid primary key default gen_random_uuid(),
  chat_room_id uuid references public.chat_rooms(id) on delete cascade not null,
  content text not null check (char_length(content) <= 2000),
  role text default 'user' check (role in ('user','bot','customer')),
  user_id uuid references auth.users(id),
  created_at timestamptz default now()
);
create index on public.messages(chat_room_id, created_at);

-- 4. RLS — ปลอดภัยระดับแถว (สำคัญ)
alter table public.orders enable row level security;
alter table public.messages enable row level security;

create policy "owner can see own orders"
on public.orders for all using (auth.uid() = user_id);

create policy "member can read messages of own order rooms"
on public.messages for select using (
  exists (select 1 from public.chat_rooms cr join public.orders o on o.id = cr.row_id where cr.id = chat_room_id and o.user_id = auth.uid())
);

-- 5. Realtime เปิดให้ฟัง
alter publication supabase_realtime add table public.orders;
alter publication supabase_realtime add table public.messages;
`,Ai={api:`// app/api/chat/route.ts — ตารางคือ Supabase
import { createClient } from "@/lib/supabase/server";
import { ratelimit } from "@/lib/ratelimit";
import { z } from "zod";

const schema = z.object({
  rowId: z.string().uuid(), // orders.id
  content: z.string().min(1).max(2000),
});

export async function POST(req: Request) {
  const supabase = createClient();
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return new Response("Unauthorized", { status: 401 });

  const ip = req.headers.get("x-forwarded-for") ?? "127.0.0.1";
  const { success } = await ratelimit.limit(ip);
  if (!success) return new Response("Too Many Requests", { status: 429 });

  const { rowId, content } = schema.parse(await req.json());

  // ตรวจสอบเจ้าของออเดอร์ — RLS จะกันอีกชั้น
  const { data: order } = await supabase.from("orders").select("id").eq("id", rowId).eq("user_id", user.id).single();
  if (!order) return new Response("Forbidden", { status: 403 });

  // /status:shipping -> อัปเดต orders.status
  if (content.startsWith("/status:")) {
    const status = content.split(":")[1].trim();
    await supabase.from("orders").update({ status }).eq("id", rowId);
  }

  // หา chat_room ของออเดอร์นี้
  const { data: room } = await supabase.from("chat_rooms").select("id").eq("row_id", rowId).single();
  const chatRoomId = room?.id ?? (await supabase.from("chat_rooms").insert({ row_id: rowId }).select("id").single()).data!.id;

  const { data: message } = await supabase.from("messages").insert({
    chat_room_id: chatRoomId,
    content,
    user_id: user.id,
    role: content.startsWith("/") ? "bot" : "user"
  }).select().single();

  // Supabase Realtime จะ broadcast อัตโนมัติ ไม่ต้อง Pusher ก็ได้
  return Response.json(message);
}

"use client";
import { useEffect, useState } from "react";
import { createClient } from "@/lib/supabase/client";

export function useOrderChat(orderId: string, chatRoomId: string) {
  const [messages, setMessages] = useState<any[]>([]);
  const [orders, setOrders] = useState<any[]>([]);
  const supabase = createClient();

  useEffect(() => {
    // ฟังแชทของออเดอร์นี้
    const msgChannel = supabase
      .channel(\`chat-room-\${chatRoomId}\`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: \`chat_room_id=eq.\${chatRoomId}\` },
        (payload) => setMessages(v => [...v, payload.new])
      ).subscribe();

    // ฟังสถานะออเดอร์เปลี่ยน
    const orderChannel = supabase
      .channel(\`order-\${orderId}\`)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "orders", filter: \`id=eq.\${orderId}\` },
        (payload) => setOrders(v => v.map(o => o.id === payload.new.id ? payload.new : o))
      ).subscribe();

    // Global รวมแชท
    const global = supabase.channel("workspace-all")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" },
        (payload) => console.log("NEW GLOBAL", payload.new)
      ).subscribe();

    return () => { supabase.removeChannel(msgChannel); supabase.removeChannel(orderChannel); supabase.removeChannel(global); };
  }, [orderId, chatRoomId]);

  const send = (content: string) => fetch("/api/chat", { method: "POST", body: JSON.stringify({ rowId: orderId, content }) });
  return { messages, orders, send };
}

import { createServerClient } from "@supabase/ssr";
import { NextResponse } from "next/server";

export async function middleware(req: Request) {
  const res = NextResponse.next();
  const supabase = createServerClient(
    process.env.NEXT_PUBLIC_SUPABASE_URL!,
    process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY!,
    { cookies: { get: (name) => req.headers.get(name), set: (name, value, opts) => res.cookies.set(name, value, opts) } } as any
  );
  const { data: { user } } = await supabase.auth.getUser();
  if (req.url.includes("/api/") && !user && !req.url.includes("/auth")) {
    return NextResponse.json({ error: "Unauthorized" }, { status: 401 });
  }
  res.headers.set("X-Frame-Options", "DENY");
  res.headers.set("X-Supabase-Grid", "cyber-purple-active");
  return res;
